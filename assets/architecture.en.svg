<svg xmlns="http://www.w3.org/2000/svg" width="1396" height="544" viewBox="0 0 1396 544" role="img" aria-label="Agent Deck Core Architecture and Information Flow">
  <defs>
    <style>
      .bg { fill: #fafaf9; stroke: #e7e5e4; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1c1917; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #78716c; }
      .grp { rx: 12; stroke-width: 1.25; }
      .grp-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px; }
      .card { fill: #ffffff; rx: 9; stroke-width: 1.25; }
      .card-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 650; fill: #1c1917; }
      .card-s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #57534e; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
      .edge-accent { fill: none; stroke: #a86f58; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .edge-sync { fill: none; stroke: #5f7d95; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
      .edge-dash { fill: none; stroke: #71917f; stroke-width: 1.6; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
      .pill-bg { fill: #fafaf9; stroke: #e7e5e4; stroke-width: 1; rx: 6; }
      .edge-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 500; fill: #44403c; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#a86f58" />
    </marker>
    <marker id="arr-sync" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#5f7d95" />
    </marker>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#71917f" />
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1394" height="542" rx="16" />

  <!-- Header -->
  <text class="title" x="28" y="34">Agent Deck · Core Architecture &amp; Information Flow</text>
  <text class="subtitle" x="1368" y="34" text-anchor="end">Delegation &amp; Guardrails · 14+ Agent Tracking · Multi-View &amp; Board Sync · Review, Audit &amp; Memory</text>

  <!-- Column 1: Obsidian Journal & Notes -->
  <rect class="grp" x="28" y="104" width="212" height="290" fill="#f7f4f1" stroke="#ded5cc" />
  <text class="grp-label" x="134" y="128" text-anchor="middle" fill="#825340">Obsidian Journal &amp; Notes</text>
  <rect class="card" x="40" y="148" width="188" height="84" stroke="#d9c6b8" />
  <text class="card-t" x="134" y="182" text-anchor="middle">Task Line / In-Place Board</text>
  <text class="card-s" x="134" y="204" text-anchor="middle">Grip · Drag · @agent · Mirror</text>
  <rect class="card" x="40" y="286" width="188" height="84" stroke="#d9c6b8" />
  <text class="card-t" x="134" y="320" text-anchor="middle">Multi-View &amp; Preview</text>
  <text class="card-s" x="134" y="342" text-anchor="middle">Outline · Table · Cards · Timeline</text>

  <!-- Column 2: Delegation & Guardrails -->
  <rect class="grp" x="310" y="104" width="186" height="290" fill="#f3f5f8" stroke="#cfd8e3" />
  <text class="grp-label" x="403" y="128" text-anchor="middle" fill="#4f667a">Delegation &amp; Guardrails</text>
  <rect class="card" x="322" y="148" width="162" height="84" stroke="#c3d0dc" />
  <text class="card-t" x="403" y="182" text-anchor="middle">Harness &amp; Policy</text>
  <text class="card-s" x="403" y="204" text-anchor="middle">Ancestors · Links · Allowlist</text>
  <rect class="card" x="322" y="286" width="162" height="84" stroke="#d4dce3" />
  <text class="card-t" x="403" y="320" text-anchor="middle">Pre-Send Preview</text>
  <text class="card-s" x="403" y="342" text-anchor="middle">ACP · Desktop · Terminal</text>

  <!-- Column 3: 14 Built-in + Custom ACP -->
  <rect class="grp" x="566" y="104" width="212" height="290" fill="#f5f3f9" stroke="#d7cfe8" />
  <text class="grp-label" x="672" y="128" text-anchor="middle" fill="#634b8a">14 Built-in + Custom ACP</text>
  <rect class="card" x="578" y="148" width="188" height="84" stroke="#cec3e3" />
  <text class="card-t" x="672" y="182" text-anchor="middle">Runners</text>
  <text class="card-s" x="672" y="204" text-anchor="middle">ACP/CLI · Desktop · Terminal</text>
  <rect class="card" x="578" y="286" width="188" height="84" stroke="#cec3e3" />
  <text class="card-t" x="672" y="320" text-anchor="middle">Local Logs &amp; Hooks</text>
  <text class="card-s" x="672" y="342" text-anchor="middle">JSONL · SQLite (Read-only)</text>

  <!-- Column 4: Agent Deck Control & Sync -->
  <rect class="grp" x="856" y="104" width="212" height="290" fill="#f2f6f8" stroke="#c8d8e0" />
  <text class="grp-label" x="962" y="128" text-anchor="middle" fill="#415f75">Agent Deck Control &amp; Sync</text>
  <rect class="card" x="868" y="148" width="188" height="84" stroke="#bfd3de" />
  <text class="card-t" x="962" y="182" text-anchor="middle">Sidebar &amp; Pinned Bar</text>
  <text class="card-s" x="962" y="204" text-anchor="middle">Live Status · Pin · Jump</text>
  <rect class="card" x="868" y="286" width="188" height="84" stroke="#bfd3de" />
  <text class="card-t" x="962" y="320" text-anchor="middle">Journal Auto-Sync</text>
  <text class="card-s" x="962" y="342" text-anchor="middle">Status · Summary · Combined</text>

  <!-- Column 5: Review, Audit & Memory -->
  <rect class="grp" x="1138" y="104" width="224" height="290" fill="#f2f7f4" stroke="#c7dbce" />
  <text class="grp-label" x="1250" y="128" text-anchor="middle" fill="#466956">Review · Audit &amp; Memory</text>
  <rect class="card" x="1150" y="148" width="200" height="84" stroke="#bed4c6" />
  <text class="card-t" x="1250" y="182" text-anchor="middle">Dashboard &amp; Audit Replay</text>
  <text class="card-s" x="1250" y="204" text-anchor="middle">Heatmap · Tasks · Security</text>
  <rect class="card" x="1150" y="286" width="200" height="84" stroke="#bed4c6" />
  <text class="card-t" x="1250" y="320" text-anchor="middle">Dreaming Memory</text>
  <text class="card-s" x="1250" y="342" text-anchor="middle">Facts/Patterns · Base &amp; Board</text>

  <!-- Edges -->
  <!-- 1. Task -> Ctx -->
  <path class="edge-accent" d="M 228 190 L 320 190" marker-end="url(#arr-accent)" />
  <rect class="pill-bg" x="245" y="170" width="58" height="19" />
  <text class="edge-lbl" x="274" y="183" text-anchor="middle">Delegate</text>

  <!-- 1b. Ctx -> Routing -->
  <path class="edge-accent" d="M 403 232 L 403 284" marker-end="url(#arr-accent)" />

  <!-- 2. Routing -> Run -->
  <path class="edge-accent" d="M 484 316 C 530 316 530 190 576 190" marker-end="url(#arr-accent)" />
  <rect class="pill-bg" x="488" y="232" width="88" height="19" />
  <text class="edge-lbl" x="532" y="245" text-anchor="middle">Launch / Resume</text>

  <!-- 3. Run -> Logs -->
  <path class="edge" d="M 672 232 L 672 284" marker-end="url(#arr)" />
  <rect class="pill-bg" x="615" y="248" width="114" height="19" />
  <text class="edge-lbl" x="672" y="261" text-anchor="middle">Transcripts &amp; Events</text>

  <!-- 4. Logs -> Panel -->
  <path class="edge-sync" d="M 766 312 C 815 312 815 190 866 190" marker-end="url(#arr-sync)" />
  <rect class="pill-bg" x="770" y="216" width="92" height="19" />
  <text class="edge-lbl" x="816" y="229" text-anchor="middle">Incremental Scan</text>

  <!-- 5. Panel <-> Task (Top lane) -->
  <path class="edge-sync" d="M 962 146 L 962 82 Q 962 70 950 70 L 146 70 Q 134 70 134 82 L 134 146" marker-start="url(#arr-sync)" marker-end="url(#arr-sync)" />
  <rect class="pill-bg" x="486" y="60" width="124" height="20" />
  <text class="edge-lbl" x="548" y="74" text-anchor="middle">Drag Bind / Jump</text>

  <!-- 6. Logs -> Sync -->
  <path class="edge-sync" d="M 766 336 L 866 336" marker-end="url(#arr-sync)" />
  <rect class="pill-bg" x="769" y="344" width="94" height="19" />
  <text class="edge-lbl" x="816" y="357" text-anchor="middle">00:00 Split &amp; Filter</text>

  <!-- 7. Sync -> Views (Lower lane A) -->
  <path class="edge-sync" d="M 962 370 L 962 418 Q 962 430 950 430 L 172 430 Q 160 430 160 418 L 160 372" marker-end="url(#arr-sync)" />
  <rect class="pill-bg" x="480" y="420" width="160" height="20" />
  <text class="edge-lbl" x="560" y="434" text-anchor="middle">Write Back to Task Block</text>

  <!-- 8. Logs -> Dash (Middle open channel between Col 4 cards) -->
  <path class="edge-dash" d="M 766 298 L 792 272 Q 804 259 820 259 L 1066 259 Q 1084 259 1090 236 L 1098 196 Q 1103 176 1120 176 L 1148 176" marker-end="url(#arr-dash)" />
  <rect class="pill-bg" x="926" y="249" width="76" height="19" />
  <text class="edge-lbl" x="964" y="262" text-anchor="middle">Usage Stats</text>

  <!-- 9 & 10. Views -> Dash & Dream (Bottom lane B, zero crossing) -->
  <path class="edge-dash" d="M 118 370 L 118 474 Q 118 486 130 486 L 1098 486 Q 1112 486 1112 474 L 1112 226 Q 1112 214 1124 214 L 1148 214" marker-end="url(#arr-dash)" />
  <path class="edge-dash" d="M 1112 344 Q 1112 332 1124 332 L 1148 332" marker-end="url(#arr-dash)" />
  <rect class="pill-bg" x="494" y="476" width="220" height="20" />
  <text class="edge-lbl" x="604" y="490" text-anchor="middle">Daily Evidence &amp; 14-Day Memory Context</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1280" height="440" rx="28" />
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1d24" />
      <stop offset="55%" stop-color="#191a21" />
      <stop offset="100%" stop-color="#14151c" />
    </linearGradient>
    <radialGradient id="glowCoral" cx="1060" cy="140" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef5b5b" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ef5b5b" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ef5b5b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="940" cy="310" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b7ec8" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#8b7ec8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#8b7ec8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="deckTop" x1="900" y1="92" x2="1172" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c3338" />
      <stop offset="100%" stop-color="#22262e" />
    </linearGradient>
    <linearGradient id="deckMid" x1="876" y1="146" x2="1196" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c283d" />
      <stop offset="100%" stop-color="#211f2e" />
    </linearGradient>
    <linearGradient id="deckFront" x1="856" y1="202" x2="1212" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282a34" />
      <stop offset="100%" stop-color="#1d1e27" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#07080d" flood-opacity="0.55" />
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1280" height="440" fill="url(#bg)" />
    <rect width="1280" height="440" fill="url(#glowCoral)" />
    <rect width="1280" height="440" fill="url(#glowViolet)" />

    <!-- Subtle architectural grid lines -->
    <line x1="824" y1="36" x2="824" y2="404" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <line x1="68" y1="354" x2="790" y2="354" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Subtle crosshair registration marks -->
    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
      <path d="M726 56 v12 M720 62 h12" />
      <path d="M792 316 v12 M786 322 h12" />
      <path d="M1208 66 v10 M1203 71 h10" />
    </g>

    <!-- Top kicker -->
    <text x="68" y="80" fill="#ef5b5b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="3">— MARKDOWN-FIRST AGENT HARNESS</text>

    <!-- Main display wordmark -->
    <text x="64" y="176" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-2">AGENT DECK</text>
    <rect x="570" y="156" width="22" height="20" rx="2" fill="#ef5b5b" />

    <!-- Tagline -->
    <text x="68" y="236" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.3">
      <tspan fill="#ffffff">以 Markdown 为正本，</tspan><tspan fill="#ef5b5b">统管所有 AI Agent。</tspan>
    </text>

    <!-- Subtitle -->
    <text x="68" y="280" fill="#9ea4b3" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16.5" font-weight="400">Obsidian 里的多客户端 AI 总控台与长期记忆闭环。</text>
    <text x="68" y="308" fill="#9ea4b3" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16.5" font-weight="400">统一追踪 17+ 本地 Agent，直接从笔记与日记派活，进度、用量与记忆全部落回 Markdown。</text>

    <!-- Bottom metadata strip -->
    <text x="68" y="388" fill="#777d8c" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.4">· 17+ AGENTS   · CLAUDE CODE + CODEX + GEMINI   · MEMORY LOOP   · APACHE-2.0</text>

    <!-- Right side: minimalist layered deck graphic (no character) -->
    <!-- Back card: Memory -->
    <g filter="url(#softShadow)">
      <rect x="908" y="88" width="268" height="82" rx="16" fill="url(#deckTop)" stroke="#85a993" stroke-opacity="0.35" stroke-width="1.2" />
      <circle cx="934" cy="116" r="5" fill="#85a993" />
      <text x="950" y="120" fill="#cdd6d1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">MEMORY // DREAMING</text>
      <rect x="930" y="138" width="150" height="6" rx="3" fill="#ffffff" fill-opacity="0.14" />
      <rect x="930" y="152" width="102" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    </g>

    <!-- Middle card: Agents -->
    <g filter="url(#softShadow)">
      <rect x="886" y="146" width="312" height="92" rx="16" fill="url(#deckMid)" stroke="#948ac0" stroke-opacity="0.42" stroke-width="1.2" />
      <circle cx="912" cy="176" r="5" fill="#948ac0" />
      <text x="928" y="180" fill="#dcd7f2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">AGENTS // 17+ LOCAL + ACP</text>
      <!-- Agent status pills -->
      <rect x="908" y="198" width="76" height="22" rx="6" fill="#ffffff" fill-opacity="0.07" />
      <text x="920" y="213" fill="#b8b2d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Claude</text>
      <rect x="992" y="198" width="66" height="22" rx="6" fill="#ffffff" fill-opacity="0.07" />
      <text x="1005" y="213" fill="#b8b2d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Codex</text>
      <rect x="1066" y="198" width="74" height="22" rx="6" fill="#ffffff" fill-opacity="0.07" />
      <text x="1078" y="213" fill="#b8b2d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Gemini</text>
      <rect x="1148" y="198" width="34" height="22" rx="6" fill="#ef5b5b" fill-opacity="0.22" />
      <text x="1156" y="213" fill="#ff9494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">+14</text>
    </g>

    <!-- Front card: Markdown Source of Truth -->
    <g filter="url(#softShadow)">
      <rect x="864" y="212" width="356" height="122" rx="18" fill="url(#deckFront)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2" />
      <circle cx="890" cy="242" r="5" fill="#ef5b5b" />
      <text x="906" y="246" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.2">MARKDOWN // SINGLE SOURCE</text>
      <text x="886" y="278" fill="#c7ccd8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">- DOING Refactor terminal registry @codex</text>
      <text x="902" y="302" fill="#85a993" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">↳ 12m · 18.4k tok · synced to daily note</text>
    </g>

    <!-- Status pill -->
    <rect x="946" y="358" width="194" height="32" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />
    <circle cx="965" cy="374" r="3.5" fill="#85a993" />
    <text x="978" y="378" fill="#d0d5e0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.6">AGENT DECK // READY</text>

    <!-- Far right vertical micro-label -->
    <text x="1252" y="220" fill="#ffffff" fill-opacity="0.18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="2.4" text-anchor="middle" transform="rotate(-90 1252 220)">OBSIDIAN PLUGIN · LOCAL-FIRST</text>
  </g>
</svg>

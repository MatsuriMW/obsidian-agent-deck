name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure sqlite3 CLI on Windows
        if: runner.os == 'Windows'
        run: choco install sqlite -y --no-progress

      - name: Run unit tests
        run: npm test

      - name: Run offline context eval
        run: npm run eval

      - name: Build plugin
        run: npm run build

      - name: Run deploy & asset checks
        run: npm run check:deploy

      - name: Typecheck macOS menu bar helper
        if: runner.os == 'macOS'
        run: swiftc -typecheck src/menubar.swift
